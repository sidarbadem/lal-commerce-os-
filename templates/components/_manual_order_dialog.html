<dialog id="manual-order-dialog" class="manual-dialog">
  <div class="manual-dialog-body">
    <h3 id="mo-title">Manuel sipariş ekle</h3>
    <div class="manual-grid">
      <label class="manual-field">Kanal
        <select id="mo-channel">
          <option value="softhydra">softhydra.com</option>
          <option value="n11">n11</option>
          <option value="amazon">Amazon</option>
        </select>
      </label>
      <label class="manual-field">Tarih ve saat
        <input type="datetime-local" id="mo-date">
      </label>
      <label class="manual-field">Sipariş no (opsiyonel)
        <input type="text" id="mo-ref" placeholder="Boşsa M-numara verilir">
      </label>
      <label class="manual-field">Müşteri (opsiyonel)
        <input type="text" id="mo-customer">
      </label>
      <label class="manual-field">Durum
        <select id="mo-status">
          <option value="Delivered">Teslim Edildi</option>
          <option value="Shipped">Kargoda</option>
          <option value="Created">Oluşturuldu</option>
          <option value="Cancelled">İptal</option>
        </select>
      </label>
      <label class="manual-field">Not (opsiyonel)
        <input type="text" id="mo-notes">
      </label>
    </div>
    <div>
      <div class="manual-field manual-label">Ürünler</div>
      <div id="mo-items"></div>
      <datalist id="mo-sku-list"></datalist>
      <button type="button" class="lal-btn lal-btn-secondary" id="mo-add-item">＋ Ürün ekle</button>
    </div>
    <div class="manual-grid">
      <label class="manual-field">Pazaryeri komisyonu
        <div class="manual-comm">
          <input type="text" id="mo-comm" inputmode="decimal" placeholder="0">
          <select id="mo-comm-mode"><option value="tl">TL</option><option value="pct">%</option></select>
        </div>
      </label>
      <label class="manual-field">Kargo maliyeti (TL)
        <input type="text" id="mo-cargo" inputmode="decimal" placeholder="0">
      </label>
    </div>
    <div class="manual-preview">
      <span>Satış: <b id="mo-p-sale">—</b></span>
      <span>Maliyet: <b id="mo-p-cogs">—</b></span>
      <span>Komisyon: <b id="mo-p-comm">—</b></span>
      <span>Kargo: <b id="mo-p-cargo">—</b></span>
      <span>Net kâr: <b id="mo-p-net">—</b></span>
    </div>
    <p class="manual-error" id="mo-error"></p>
    <div class="manual-actions">
      <button type="button" class="lal-btn lal-btn-secondary" id="mo-cancel">Vazgeç</button>
      <button type="button" class="lal-btn lal-btn-primary" id="mo-save">Kaydet</button>
    </div>
  </div>
</dialog>
